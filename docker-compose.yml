services:
  mirrorgpt:
    image: sjkwk/mirrorgpt:latest
    container_name: mirrorgpt
    restart: unless-stopped
    ports:
      - "6787:6787"
    environment:
      NODE_ENV: production
      PORT: 6787
      HOSTNAME: 0.0.0.0
      DATABASE_URL: "file:../data/chat_sessions.db"
      # 直接用 http://IP:6787 访问时必须为 false；如果前面接 HTTPS 域名，可以改为 true。
      AUTH_COOKIE_SECURE: "false"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./public/generated-images:/app/public/generated-images
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:6787').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
